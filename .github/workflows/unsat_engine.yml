name: Dependency UNSAT Core Engine

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unsat-core-compile
  cancel-in-progress: false

jobs:
  solve-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/unsat_mesh.db
          key: unsat-mesh-db-${{ github.run_id }}
          restore-keys: |
            unsat-mesh-db-

      - name: Execute UNSAT Core Solver Engine
        run: python unsat_engine.py

      - name: Commit Historical Ledger and Constraints
        run: |
          git config user.name "unsat-bot[bot]"
          git config user.email "unsat-bot@users.noreply.github.com"

          # Stage ledger, parquet, and generated public API artifacts
          git add ledger/ data/package-constraints.parquet public/

          if git diff --staged --quiet; then
            echo "No new resolution proofs to commit."
          else
            git commit -m "chore(unsat): record dependency conflict proofs and remediations [skip ci]"

            # Attempt pull --rebase and push with retries, prioritizing fresh engine outputs (-X theirs)
            pushed=false
            for i in {1..3}; do
              echo "Pulling latest main and rebasing with fresh local outputs (attempt $i)..."
              if git pull --rebase -X theirs origin main && git push origin main; then
                pushed=true
                break
              fi
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            done

            if [ "$pushed" = false ]; then
              echo "Failed to push after 3 attempts."
              exit 1
            fi
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
